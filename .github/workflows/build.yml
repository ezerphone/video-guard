name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Collect APK
        run: cp app/build/outputs/apk/debug/app-debug.apk VideoGuard.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VideoGuard
          path: VideoGuard.apk

      - name: Publish release (latest)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest VideoGuard.apk \
            --title "VideoGuard — download" \
            --notes "VideoGuard APK (android.ezerphone.videoguard). Build stage: base. See README."
