name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      # מפתח חתימה קבוע מה-secrets (ראה README). בלעדיו כל בנייה נחתמת במפתח אקראי ועדכונים נכשלים.
      - name: Signing key
        env:
          VG_KEYSTORE_B64: ${{ secrets.VG_KEYSTORE_B64 }}
        run: |
          if [ -n "$VG_KEYSTORE_B64" ]; then
            echo "$VG_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/vg.keystore"
            echo "VG_KEYSTORE=$RUNNER_TEMP/vg.keystore" >> "$GITHUB_ENV"
            echo "Signing with the stable key"
          else
            echo "::warning::Secret VG_KEYSTORE_B64 is not set: the APK is signed with a random debug key and cannot update an installed copy."
          fi

      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Build debug APK
        env:
          VG_KEYSTORE_PASSWORD: ${{ secrets.VG_KEYSTORE_PASSWORD }}
          VG_KEY_ALIAS: ${{ secrets.VG_KEY_ALIAS }}
          VG_KEY_PASSWORD: ${{ secrets.VG_KEY_PASSWORD }}
        run: gradle assembleDebug --no-daemon

      - name: Collect APK
        run: cp app/build/outputs/apk/debug/app-debug.apk VideoGuard.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VideoGuard
          path: VideoGuard.apk

      - name: Publish release (latest)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest VideoGuard.apk \
            --title "VideoGuard — download" \
            --notes "VideoGuard 3 APK (android.ezerphone.videoguard). See README."
